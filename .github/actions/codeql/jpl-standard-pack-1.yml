name: "CodeQL JPL Coding Standard - Errors and Warnings"

disable-default-queries: true

packs:
  # Source: https://github.com/github/codeql/tree/main/cpp/ql/src/JPL_C
  - codeql/cpp-queries:JPL_C

paths-ignore:
  - build-fprime-automatic-*/
  - fprime-venv/
  - googletest/
  - Utils/Hash/libcrc/
  - docs/
  - cmake/

# Disabled queries: see nasa/fprime#2562.
query-filters:
  - exclude:
      problem.severity:
        - recommendation
  - exclude:
      id:
        - cpp/jpl-c/checking-parameter-values
