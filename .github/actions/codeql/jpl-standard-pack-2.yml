name: "CodeQL JPL Coding Standard - Recommendations"

disable-default-queries: true

packs:
  # Source: https://github.com/github/codeql/tree/main/cpp/ql/src/JPL_C
  - codeql/cpp-queries:JPL_C

paths-ignore:
  - build-fprime-automatic-*/
  - fprime-venv/
  - googletest/
  - Utils/Hash/libcrc/
  - docs/
  - cmake/

# Disabled queries: see nasa/fprime#2562.
query-filters:
  - exclude:
      problem.severity:
        - error
        - warning
  - exclude:
      id:
        - cpp/jpl-c/function-size-limits
        - cpp/jpl-c/multiple-stmts-per-line
