# Per-module + global code coverage check for pull requests.
#
# Generates coverage for every module that calls register_fprime_module(),
# compares against the matching coverage/<base_ref> baseline branch, and
# uploads the resulting comment body as a workflow artifact.  The
# sticky PR comment itself is posted by a separate workflow_run job
# (.github/workflows/coverage-comment.yml) that runs with
# pull-requests: write under the base repo's token.
#
# This two-stage split is the GitHub-recommended pattern for
# commenting on PRs opened from forks: GitHub strips write permissions
# from GITHUB_TOKEN on fork-triggered pull_request events, so this
# workflow (which runs on fork content) only ever needs read access.
# See nasa/fprime-actions/coverage-comment/README.md for the rationale.
#
# The push-side counterpart that writes the baseline branch lives in
# .github/workflows/coverage-update.yml and runs with contents: write.
#
# See nasa/fprime-actions/coverage-check/README.md for input documentation.

name: "Coverage Check"

on:
  pull_request:
    branches: [ devel, release/**, coverage-test ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ut-coverage-check:
    name: "UT Coverage [PR]"
    # ubuntu-24.04 ships gcov-13, which is required: gcov-11 (Ubuntu
    # 22.04 default) has counter-overflow bugs and pathological slowness
    # on heavily-templated test code that can turn a 30 s coverage run
    # into a 30+ min one.  See nasa/fprime-actions/coverage-common's
    # README for details.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F' Tools"
        uses: JPL-Devin/fprime-actions/setup@devin/1780361490-integration-coverage
        with:
          location: ${{ github.workspace }}
      - name: "Generate + Build UTs"
        uses: JPL-Devin/fprime-actions/run-unit-tests@devin/1780361490-integration-coverage
        with:
          run-check: 'false'
          jobs: random
      - name: "Coverage (common)"
        id: cov
        uses: JPL-Devin/fprime-actions/coverage-common@devin/1780361490-integration-coverage
        with:
          working-directory: ${{ github.workspace }}
      - name: "Coverage check"
        uses: JPL-Devin/fprime-actions/coverage-check@devin/1780361490-integration-coverage
        with:
          working-directory: ${{ github.workspace }}
          modules-jsonl: ${{ steps.cov.outputs.modules-jsonl }}

  integration-coverage-check:
    name: "Integration Coverage [PR]"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F' Tools"
        uses: JPL-Devin/fprime-actions/setup@devin/1780361490-integration-coverage
        with:
          location: ${{ github.workspace }}
      - name: "Build Ref with coverage"
        uses: JPL-Devin/fprime-actions/build@devin/1780361490-integration-coverage
        with:
          working-directory: "TestDeploymentsProject"
          generate-args: >-
            -DCMAKE_CXX_FLAGS="--coverage"
            -DCMAKE_C_FLAGS="--coverage"
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: "Integration Tests"
        uses: JPL-Devin/fprime-actions/run-integration-tests@devin/1780361490-integration-coverage
        with:
          gds-working-directory: "TestDeploymentsProject"
          test-working-directory: "TestDeploymentsProject/Ref/test/int"
          binary: "build-artifacts/*/Ref/bin/Ref"
          gds-args: "--dictionary build-artifacts/*/Ref/dict/RefTopologyDictionary.json"
          pytest-args: "--deployment-config ${{ github.workspace }}/TestDeploymentsProject/Ref/test/int/int_config.json"
      - name: "Integration Coverage (common)"
        id: intcov
        uses: JPL-Devin/fprime-actions/coverage-integration-common@devin/1780361490-integration-coverage
        with:
          working-directory: ${{ github.workspace }}
          build-cache: TestDeploymentsProject/build-fprime-automatic-native
      - name: "Integration Coverage check"
        uses: JPL-Devin/fprime-actions/coverage-check@devin/1780361490-integration-coverage
        with:
          working-directory: ${{ github.workspace }}
          modules-jsonl: ${{ steps.intcov.outputs.modules-jsonl }}
          coverage-kind: ${{ steps.intcov.outputs.coverage-kind }}
