# Build, integration test, and unit test verification for the F' Ref deployment.

name: "Ref"

on:
  schedule:
    - cron: "0 21 * * *"  # Nightly at 2:00 PM US/Pacific (PDT)
  push:
    branches: [release/**]
  pull_request:
    branches: [devel, release/**]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/actions/spelling/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/agents/**"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-22.04, macos-latest)"
        required: false
        default: ""
      jobs:
        description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

permissions:
  contents: read

jobs:
  build:
    name: "Build [${{ matrix.runner }}]"
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on the nightly schedule
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"},{"runner":"macos-latest","jobs":"2"}]') || fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"}]') }}
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Build Ref"
        uses: nasa/fprime-actions/build@devel
        with:
          working-directory: "TestDeploymentsProject"
          jobs: ${{ github.event.inputs.jobs || matrix.jobs }}
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ref-build-artifacts-${{ matrix.runner }}
          path: TestDeploymentsProject/build-artifacts/
          retention-days: 1

  integration-tests:
    name: "Integration Tests [${{ matrix.runner }}]"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on the nightly schedule
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"runner":"ubuntu-22.04"},{"runner":"macos-latest"}]') || fromJSON('[{"runner":"ubuntu-22.04"}]') }}
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Download Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: ref-build-artifacts-${{ matrix.runner }}
          path: TestDeploymentsProject/build-artifacts/
      - name: "Make binary executable"
        run: chmod +x TestDeploymentsProject/build-artifacts/*/Ref/bin/Ref
      - name: "Install valgrind"
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y valgrind
      - name: "Install coreutils (macOS)"
        if: runner.os == 'macOS'
        run: brew install coreutils
      - name: "Integration Tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          gds-working-directory: "TestDeploymentsProject"
          test-working-directory: "TestDeploymentsProject"
          binary: "build-artifacts/*/Ref/bin/Ref"
          gds-args: "--dictionary build-artifacts/*/Ref/dict/RefTopologyDictionary.json"
          pytest-args: "Ref --deployment-config ${{ github.workspace }}/TestDeploymentsProject/Ref/test/int/int_config.json"
          valgrind: ${{ runner.os == 'Linux' && 'true' || 'false' }}

  unit-tests:
    name: "UTs [${{ matrix.runner }}]"
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on the nightly schedule
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"},{"runner":"macos-latest","jobs":"2"}]') || fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"}]') }}
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Run Unit Tests"
        uses: nasa/fprime-actions/run-unit-tests@devel
        with:
          working-directory: "TestDeploymentsProject"
          jobs: ${{ github.event.inputs.jobs || matrix.jobs }}

  # Segmented TC uplink (Segment Header / MAP reassembly) coverage. Every build in this job
  # lives under TestDeploymentsProject (the only project()), so each one gets its own
  # --build-cache (bc-<name>) and install destination (art-<name>) under the workspace. The
  # install destination is selected with DESTDIR at build time: fprime-util always passes
  # FPRIME_INSTALL_DEST from settings.ini, so a -DFPRIME_INSTALL_DEST on the command line is
  # overridden, whereas cmake/target/fprime_install.cmake honors a caller-provided DESTDIR.
  ref-segmented:
    name: "Ref segmented TC [ubuntu-22.04]"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OPENSSL_VERSION: "3.5.1"
      OPENSSL_SHA256: "529043b15cffa5f36077a4d0af83f3de399807181d607441d734196d889b641f"
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Cache OpenSSL 3.5"
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ~/openssl-3.5
          key: openssl-${{ env.OPENSSL_VERSION }}-ubuntu-22.04
      - name: "Provision OpenSSL 3.5"
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$(mktemp -d)"
          cd "${SRC}"
          curl -fsSL -o "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum -c -
          tar xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib no-tests
          make -j"$(nproc)"
          make install_sw
      # Deliberately NOT exported as OPENSSL_ROOT_DIR: CMake's FindOpenSSL honors that environment
      # variable, and the default Ref / no-SDLS builds below must not see OpenSSL 3.5.
      - name: "Export OpenSSL 3.5 location"
        run: echo "OPENSSL_35_ROOT=$HOME/openssl-3.5" >> "$GITHUB_ENV"
      - name: "Build Ref segmented (REF_TC_SEGMENTED=ON)"
        working-directory: TestDeploymentsProject
        run: |
          set -euo pipefail
          fprime-util generate --build-cache "$GITHUB_WORKSPACE/bc-ref-seg" -DREF_TC_SEGMENTED=ON
          DESTDIR="$GITHUB_WORKSPACE/art-ref-seg" \
            fprime-util build --build-cache "$GITHUB_WORKSPACE/bc-ref-seg" -j"$(nproc)"
          # The variant must carry the MAP reassembler and its pool in the dictionary (packetised by
          # RefPacketsSegmented.fppi) and the scheduler connection of the pool manager.
          DICT=$(ls "$GITHUB_WORKSPACE"/art-ref-seg/*/Ref/dict/RefTopologyDictionary.json)
          grep -q '"ComCcsds.tcMapReassembler.PacketsReassembled"' "${DICT}"
          grep -q '"ComCcsds.tcPacketBufferManager.NoBuffs"' "${DICT}"
          grep -q "tcPacketBufferManager.get_schedIn_InputPort(" "$GITHUB_WORKSPACE/bc-ref-seg/Ref/Top/RefTopologyAc.cpp"
      - name: "Build Ref default"
        working-directory: TestDeploymentsProject
        run: |
          set -euo pipefail
          fprime-util generate --build-cache "$GITHUB_WORKSPACE/bc-ref-default"
          DESTDIR="$GITHUB_WORKSPACE/art-ref-default" \
            fprime-util build --build-cache "$GITHUB_WORKSPACE/bc-ref-default" -j"$(nproc)"
      - name: "Checkout base commit"
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          filter: blob:none
          submodules: true
      - name: "Build Ref default (base commit)"
        if: github.event_name == 'pull_request'
        working-directory: base/TestDeploymentsProject
        run: |
          set -euo pipefail
          fprime-util generate --build-cache "$GITHUB_WORKSPACE/bc-ref-base"
          DESTDIR="$GITHUB_WORKSPACE/art-ref-base" \
            fprime-util build --build-cache "$GITHUB_WORKSPACE/bc-ref-base" -j"$(nproc)"
      - name: "Dictionary regression (default Ref vs base)"
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASELINE=$(ls "$GITHUB_WORKSPACE"/art-ref-base/*/Ref/dict/RefTopologyDictionary.json)
          CANDIDATE=$(ls "$GITHUB_WORKSPACE"/art-ref-default/*/Ref/dict/RefTopologyDictionary.json)
          python3 TestDeploymentsProject/Ref/test/int/check_dictionary_regression.py \
            --baseline "${BASELINE}" --candidate "${CANDIDATE}"
      - name: "Build Segmented subtopology deployment (no SDLS)"
        working-directory: TestDeploymentsProject/SubtopologyBuilds/Segmented
        run: |
          set -euo pipefail
          fprime-util generate --build-cache "$GITHUB_WORKSPACE/bc-seg-nosdls" \
            -DSEGMENTED_DEPLOYMENT=ON -DSEGMENTED_SDLS=OFF
          DESTDIR="$GITHUB_WORKSPACE/art-seg-nosdls" \
            fprime-util build --build-cache "$GITHUB_WORKSPACE/bc-seg-nosdls" -j"$(nproc)"
      - name: "Build Segmented subtopology deployment (SDLS, AES-GCM)"
        working-directory: TestDeploymentsProject/SubtopologyBuilds/Segmented
        run: |
          set -euo pipefail
          fprime-util generate --build-cache "$GITHUB_WORKSPACE/bc-seg-sdls" \
            -DSEGMENTED_DEPLOYMENT=ON -DSEGMENTED_SDLS=ON -DOPENSSL_ROOT_DIR="${OPENSSL_35_ROOT}"
          # AesGcmDecryptor must actually be registered (the generate above fails on an
          # undefined Svc.Ccsds.AesGcmDecryptor symbol otherwise); make the check explicit.
          test -d "$GITHUB_WORKSPACE/bc-seg-sdls/F-Prime/Svc/Ccsds/AesGcmDecryptor"
          DESTDIR="$GITHUB_WORKSPACE/art-seg-sdls" \
            fprime-util build --build-cache "$GITHUB_WORKSPACE/bc-seg-sdls" -j"$(nproc)"
          # Generated topology must configure the key manager and wire decryptor.keyGet to it.
          AC="$GITHUB_WORKSPACE/bc-seg-sdls/SubtopologyBuilds/Segmented/Top/SegmentedTopologyAc.cpp"
          grep -q "sdlsKeyManager.configure(" "${AC}"
          grep -q "decryptor.set_keyGet_OutputPort(" "${AC}"
          grep -q "sdlsKeyManager.get_keyGet_InputPort(" "${AC}"
      - name: "Unit tests (Svc/Ccsds with OpenSSL 3.5)"
        working-directory: Svc/Ccsds
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${OPENSSL_35_ROOT}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fprime-util generate --ut --build-cache "$GITHUB_WORKSPACE/bc-ut-ccsds" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_35_ROOT}"
          test -d "$GITHUB_WORKSPACE/bc-ut-ccsds/F-Prime/Svc/Ccsds/AesGcmDecryptor"
          fprime-util check --recursive --build-cache "$GITHUB_WORKSPACE/bc-ut-ccsds" -j"$(nproc)"
      # Segmented Ref must not carry the reassembler into the default dictionary.
      - name: "Dictionary check (default Ref has no reassembler)"
        run: |
          set -euo pipefail
          DICT=$(ls "$GITHUB_WORKSPACE"/art-ref-default/*/Ref/dict/RefTopologyDictionary.json)
          ! grep -q 'tcMapReassembler' "${DICT}"
      # Integration tests (Svc/Ccsds/TcMapReassembler/test/int) drive the uplink through the tc-segment
      # framing plugin (Space Packets segmented into Type-BD TC frames with Segment Headers). It is a
      # selection plugin: loaded with FPRIME_GDS_EXTRA_PLUGINS (module:Class) and enabled with
      # --framing-selection tc-segment. No value below may contain a space (the action word-splits).
      - name: "Integration tests: I1-I12, I19 (Ref segmented)"
        uses: nasa/fprime-actions/run-integration-tests@devel
        env:
          PYTHONPATH: ${{ github.workspace }}/Svc/Ccsds/TcMapReassembler/test/int
          FPRIME_GDS_EXTRA_PLUGINS: tc_segment_plugin.framing:TcSegmentFraming
        with:
          gds-working-directory: "TestDeploymentsProject"
          test-working-directory: "."
          binary: "${{ github.workspace }}/art-ref-seg/*/Ref/bin/Ref"
          gds-args: "--dictionary ${{ github.workspace }}/art-ref-seg/*/Ref/dict/RefTopologyDictionary.json --framing-selection tc-segment"
          pytest-args: "Svc/Ccsds/TcMapReassembler/test/int -m segmented --dictionary ${{ github.workspace }}/art-ref-seg/*/Ref/dict/RefTopologyDictionary.json --deployment-config ${{ github.workspace }}/TestDeploymentsProject/Ref/test/int/int_config.json"
      # run-integration-tests stops the fprime-gds launcher only; its comm/data-handler children
      # survive and keep 0.0.0.0:50000 and the ZMQ endpoints, which makes the next ground system
      # fail with "Address already in use".
      - name: "Stop leftover ground-system processes"
        run: pkill -KILL -f "[f]prime_gds.executables" || true
      - name: "Integration tests: I14-I18 (Segmented, SDLS AES-GCM, SPI 1)"
        uses: nasa/fprime-actions/run-integration-tests@devel
        env:
          LD_LIBRARY_PATH: ${{ env.OPENSSL_35_ROOT }}/lib
          PYTHONPATH: ${{ github.workspace }}/Svc/Ccsds/TcMapReassembler/test/int
          FPRIME_GDS_EXTRA_PLUGINS: tc_segment_plugin.framing:TcSegmentFraming
        with:
          gds-working-directory: "TestDeploymentsProject"
          test-working-directory: "."
          binary: "${{ github.workspace }}/art-seg-sdls/*/SubtopologyBuilds_Segmented/bin/SubtopologyBuilds_Segmented"
          binary-args: "-a 127.0.0.1 -p 50000 --sdls-key-file ${{ github.workspace }}/TestDeploymentsProject/SubtopologyBuilds/Segmented/test/int/sdls_test_key.bin"
          gds-args: "--dictionary ${{ github.workspace }}/art-seg-sdls/*/SubtopologyBuilds_Segmented/dict/SegmentedTopologyDictionary.json --framing-selection tc-segment --tc-segment-sdls-key-file ${{ github.workspace }}/TestDeploymentsProject/SubtopologyBuilds/Segmented/test/int/sdls_test_key.bin"
          pytest-args: "Svc/Ccsds/TcMapReassembler/test/int -m sdls --fsw-stdout-log ${{ github.workspace }}/TestDeploymentsProject/gds-logs/fsw.stdout.log --dictionary ${{ github.workspace }}/art-seg-sdls/*/SubtopologyBuilds_Segmented/dict/SegmentedTopologyDictionary.json --deployment-config ${{ github.workspace }}/TestDeploymentsProject/SubtopologyBuilds/Segmented/test/int/int_config.json"
      - name: "Stop leftover ground-system processes (SDLS)"
        run: pkill -KILL -f "[f]prime_gds.executables" || true
      - name: "Integration tests: I13 (feature-off probe, default Ref)"
        uses: nasa/fprime-actions/run-integration-tests@devel
        env:
          PYTHONPATH: ${{ github.workspace }}/Svc/Ccsds/TcMapReassembler/test/int
          FPRIME_GDS_EXTRA_PLUGINS: tc_segment_plugin.framing:TcSegmentFraming
        with:
          gds-working-directory: "TestDeploymentsProject"
          test-working-directory: "."
          binary: "${{ github.workspace }}/art-ref-default/*/Ref/bin/Ref"
          gds-args: "--dictionary ${{ github.workspace }}/art-ref-default/*/Ref/dict/RefTopologyDictionary.json --framing-selection tc-segment"
          pytest-args: "Svc/Ccsds/TcMapReassembler/test/int -m feature_off --dictionary ${{ github.workspace }}/art-ref-default/*/Ref/dict/RefTopologyDictionary.json --deployment-config ${{ github.workspace }}/TestDeploymentsProject/Ref/test/int/int_config.json"
      - name: "Archive segmented build artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ref-segmented-build-artifacts
          path: |
            art-ref-seg/
            art-seg-nosdls/
            art-seg-sdls/
            TestDeploymentsProject/gds-logs/
          retention-days: 1

  timing-check:
    name: "Timing Check"
    runs-on: ubuntu-latest
    needs: [build, integration-tests, unit-tests, ref-segmented]
    if: always()
    permissions:
      actions: read
      contents: read
    steps:
      - name: "Check Job Timings"
        uses: nasa/fprime-actions/timing-check@devel
