# Per-module + global code coverage for the F' framework.
#
# Split into two mutually exclusive jobs so each gets exactly the
# permissions it needs:
#   coverage-pr   — contents: read + pull-requests: write  (PR comment)
#   coverage-push — contents: write                        (orphan branch push)
#
# On pull_request against devel or release/**, the PR job generates
# coverage for every module that calls register_fprime_module(), compares
# against the coverage/<base_ref> baseline, and posts a sticky comment.
#
# On push to devel, release/**, or v* tags (and workflow_dispatch), the
# push job generates the same outputs and commits them to an orphan branch
# named coverage/<ref-name>.
#
# See nasa/fprime-actions/coverage/README.md for input documentation and
# baseline-branch layout.

name: "Coverage"

on:
  push:
    branches: [ devel, release/** ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

jobs:
  # ---------- PR path: compare against baseline, post comment ----------
  coverage-pr:
    name: "Coverage [PR]"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 90
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F' Tools"
        uses: JPL-Devin/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Generate + Build UTs"
        uses: JPL-Devin/fprime-actions/run-unit-tests@devin/1779136531-coverage-action
        with:
          run-check: 'false'
          jobs: ${{ github.event.inputs.jobs || 'random' }}
      - name: "Coverage (common)"
        id: cov
        uses: JPL-Devin/fprime-actions/coverage-common@devin/1779136531-coverage-action
        with:
          working-directory: ${{ github.workspace }}
          jobs: ${{ github.event.inputs.jobs || 'random' }}
      - name: "Coverage check"
        uses: JPL-Devin/fprime-actions/coverage-check@devin/1779136531-coverage-action
        with:
          working-directory: ${{ github.workspace }}
          modules-jsonl: ${{ steps.cov.outputs.modules-jsonl }}

  # ---------- Push / dispatch path: seed or update baseline branch ----------
  coverage-push:
    name: "Coverage [push]"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F' Tools"
        uses: JPL-Devin/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Generate + Build UTs"
        uses: JPL-Devin/fprime-actions/run-unit-tests@devin/1779136531-coverage-action
        with:
          run-check: 'false'
          jobs: ${{ github.event.inputs.jobs || 'random' }}
      - name: "Coverage (common)"
        id: cov
        uses: JPL-Devin/fprime-actions/coverage-common@devin/1779136531-coverage-action
        with:
          working-directory: ${{ github.workspace }}
          jobs: ${{ github.event.inputs.jobs || 'random' }}
      - name: "Coverage update"
        uses: JPL-Devin/fprime-actions/coverage-update@devin/1779136531-coverage-action
        with:
          working-directory: ${{ github.workspace }}
          modules-jsonl: ${{ steps.cov.outputs.modules-jsonl }}
