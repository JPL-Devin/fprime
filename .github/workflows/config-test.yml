# Verify that F' builds and passes unit tests under the "direct-port-calls"
# configuration profile from ci/config-profiles.json.  The remainder of the
# profile matrix runs in the nightly "Config Test Nightly" workflow.

name: "Config Test"

on:
  push:
    branches: [ release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Generate the build matrix from ci/config-profiles.json (one profile only)
  # ---------------------------------------------------------------------------
  generate-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      PROFILE: "direct-port-calls"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          sparse-checkout: ci/config-profiles.json
          sparse-checkout-cone-mode: false

      - name: "Build matrix JSON"
        id: set-matrix
        shell: bash
        run: |
          MATRIX=$(jq -c --arg name "$PROFILE" '[.[] | select(.disabled != true) | select(.name == $name)]' ci/config-profiles.json)
          if [ "$(echo "$MATRIX" | jq -r 'length')" -eq 0 ]; then
            echo "::error::config profile '$PROFILE' is missing or disabled in ci/config-profiles.json"
            exit 1
          fi
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build framework + Ref with each config profile
  # ---------------------------------------------------------------------------
  config-build:
    name: "Build [${{ matrix.name }}]"
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true

      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
          ccache-key-suffix: -${{ matrix.name }}

      - name: "Build Framework [${{ matrix.name }}]"
        uses: nasa/fprime-actions/build@devel
        with:
          build-all: "true"
          generate-args: "${{ matrix.generate-args }}"
          jobs: "random"

      - name: "Build Ref [${{ matrix.name }}]"
        uses: nasa/fprime-actions/build@devel
        with:
          working-directory: "TestDeploymentsProject"
          generate-args: "${{ matrix.generate-args }}"
          jobs: "random"

  # ---------------------------------------------------------------------------
  # Run unit tests with each config profile
  # ---------------------------------------------------------------------------
  config-ut:
    name: "UTs [${{ matrix.name }}]"
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true

      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
          ccache-key-suffix: -${{ matrix.name }}

      - name: "Run Framework UTs [${{ matrix.name }}]"
        uses: nasa/fprime-actions/run-unit-tests@devel
        with:
          generate-args: "${{ matrix.generate-args }}"
          jobs: "random"

      - name: "Run Ref UTs [${{ matrix.name }}]"
        uses: nasa/fprime-actions/run-unit-tests@devel
        with:
          working-directory: "TestDeploymentsProject"
          generate-args: "${{ matrix.generate-args }}"
          jobs: "random"
